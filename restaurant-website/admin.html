
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Admin Dashboard - Kolkata Victoria Chat House
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* =========================================
           HEADER
        ========================================= */

        header {
            background: linear-gradient(
                135deg,
                #e65100,
                #ff6d00
            );

            color: white;

            padding: 18px 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;
        }

        header h1 {
            margin: 0;

            font-size: 24px;
        }

        .header-buttons {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        button {
            border: none;

            cursor: pointer;

            border-radius: 6px;

            padding: 10px 16px;

            font-size: 14px;
        }

        .logout-btn {
            background: #b71c1c;

            color: white;
        }

        .menu-btn {
            background: #fff3e0;

            color: #e65100;

            font-weight: bold;
        }

        /* =========================================
           SOUND STATUS
        ========================================= */

        #soundStatus {
            text-align: center;

            background: #fff3e0;

            color: #e65100;

            padding: 10px;

            font-weight: bold;
        }

        /* =========================================
           NOTIFICATION
        ========================================= */

        #notification {
            display: none;

            position: fixed;

            top: 20px;

            right: 20px;

            width: 330px;

            max-width: calc(100% - 40px);

            background: white;

            border-left: 6px solid #e65100;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.25);

            padding: 18px;

            z-index: 9999;

            border-radius: 8px;
        }

        #notification h3 {
            margin-top: 0;

            color: #e65100;
        }

        #notification p {
            margin: 8px 0;
        }

        .notification-buttons {
            display: flex;

            gap: 8px;

            margin-top: 15px;
        }

        .prepare-notification {
            background: #e65100;

            color: white;

            flex: 1;
        }

        .close-notification {
            background: #ddd;

            color: #333;
        }

        /* =========================================
           CONTAINER
        ========================================= */

        .container {
            width: 95%;

            max-width: 1300px;

            margin: 25px auto;
        }

        /* =========================================
           STATISTICS
        ========================================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: white;

            padding: 20px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.1);

            text-align: center;
        }

        .stat-card h2 {
            margin: 0;

            color: #e65100;

            font-size: 30px;
        }

        .stat-card p {
            margin-bottom: 0;

            color: #666;
        }

        /* =========================================
           SEARCH
        ========================================= */

        .search-box {
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;

            padding: 14px 18px;

            border: 2px solid #e65100;

            border-radius: 30px;

            font-size: 16px;

            outline: none;
        }

        .search-box input:focus {
            border-color: #ff6d00;

            box-shadow:
                0 0 8px rgba(230, 81, 0, 0.2);
        }

        /* =========================================
           SECTIONS
        ========================================= */

        .order-section {
            margin-bottom: 35px;
        }

        .section-title {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }

        .section-title h2 {
            margin: 0;

            color: #e65100;
        }

        .order-count {
            background: #e65100;

            color: white;

            border-radius: 20px;

            padding: 5px 12px;

            font-size: 13px;
        }

        /* =========================================
           ORDER GRID
        ========================================= */

        .orders {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(300px, 1fr)
                );

            gap: 15px;
        }

        .order-card {
            background: white;

            border-radius: 10px;

            padding: 18px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.12);

            border-top: 5px solid #e65100;
        }

        .order-card h3 {
            margin-top: 0;

            color: #e65100;
        }

        .order-card p {
            margin: 7px 0;
        }

        .order-items {
            background: #f8f8f8;

            padding: 10px;

            border-radius: 6px;

            margin: 12px 0;
        }

        .order-item {
            display: flex;

            justify-content: space-between;

            gap: 10px;

            padding: 5px 0;

            border-bottom: 1px solid #ddd;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .total {
            font-size: 18px;

            font-weight: bold;

            color: #e65100;
        }

        .status-buttons {
            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            margin-top: 15px;
        }

        .status-buttons button {
            flex: 1;

            min-width: 90px;

            color: white;
        }

        .preparing-btn {
            background: #f57c00;
        }

        .ready-btn {
            background: #388e3c;
        }

        .completed-btn {
            background: #1976d2;
        }

        .empty {
            background: white;

            padding: 25px;

            text-align: center;

            border-radius: 8px;

            color: #777;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 800px) {

            header {
                flex-direction: column;

                align-items: stretch;

                text-align: center;
            }

            .header-buttons {
                justify-content: center;
            }

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .orders {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {

            .container {
                width: 92%;
            }

            header h1 {
                font-size: 20px;
            }

            .stats {
                grid-template-columns:
                    1fr 1fr;

                gap: 10px;
            }

            .stat-card {
                padding: 15px 8px;
            }

            .stat-card h2 {
                font-size: 24px;
            }

            #notification {
                top: 10px;

                right: 10px;

                width: calc(100% - 20px);
            }
        }

    </style>

</head>

<body>

<header>

    <h1>
        🍽️ Kolkata Victoria Chat House
    </h1>

    <div class="header-buttons">

        <button
            class="menu-btn"
            onclick="openMenuManagement()">

            🍽️ Menu Management

        </button>

        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>

</header>


<div id="soundStatus">

    🔊 Order notification sound is automatic.
    Sound will activate after your first interaction with this page.

</div>


<!-- =========================================
     NEW ORDER NOTIFICATION
========================================= -->

<div id="notification">

    <h3>
        🔔 NEW ORDER!
    </h3>

    <p id="notificationText">
        New order received.
    </p>

    <div class="notification-buttons">

        <button
            class="prepare-notification"
            onclick="prepareNotificationOrder()">

            👨‍🍳 Mark Preparing

        </button>

        <button
            class="close-notification"
            onclick="closeNotification()">

            Close

        </button>

    </div>

</div>


<div class="container">


    <!-- =========================================
         STATISTICS
    ========================================= -->

    <div class="stats">

        <div class="stat-card">

            <h2 id="newCount">
                0
            </h2>

            <p>
                New Orders
            </p>

        </div>


        <div class="stat-card">

            <h2 id="preparingCount">
                0
            </h2>

            <p>
                Preparing
            </p>

        </div>


        <div class="stat-card">

            <h2 id="readyCount">
                0
            </h2>

            <p>
                Ready
            </p>

        </div>


        <div class="stat-card">

            <h2 id="completedCount">
                0
            </h2>

            <p>
                Completed
            </p>

        </div>

    </div>


    <!-- =========================================
         SEARCH
    ========================================= -->

    <div class="search-box">

        <input
            type="text"
            id="orderSearch"
            placeholder="🔎 Search by customer name, phone or order ID..."
            oninput="searchOrders()">

    </div>


    <!-- =========================================
         NEW ORDERS
    ========================================= -->

    <section class="order-section">

        <div class="section-title">

            <h2>
                🆕 New Orders
            </h2>

            <span
                class="order-count"
                id="newSectionCount">

                0

            </span>

        </div>

        <div
            class="orders"
            id="newOrders">
        </div>

    </section>


    <!-- =========================================
         PREPARING
    ========================================= -->

    <section class="order-section">

        <div class="section-title">

            <h2>
                👨‍🍳 Preparing
            </h2>

            <span
                class="order-count"
                id="preparingSectionCount">

                0

            </span>

        </div>

        <div
            class="orders"
            id="preparingOrders">
        </div>

    </section>


    <!-- =========================================
         READY
    ========================================= -->

    <section class="order-section">

        <div class="section-title">

            <h2>
                ✅ Ready
            </h2>

            <span
                class="order-count"
                id="readySectionCount">

                0

            </span>

        </div>

        <div
            class="orders"
            id="readyOrders">
        </div>

    </section>


    <!-- =========================================
         COMPLETED
    ========================================= -->

    <section class="order-section">

        <div class="section-title">

            <h2>
                📦 Completed
            </h2>

            <span
                class="order-count"
                id="completedSectionCount">

                0

            </span>

        </div>

        <div
            class="orders"
            id="completedOrders">
        </div>

    </section>

</div>


<script>


    /* =========================================
       ADMIN LOGIN CHECK
    ========================================= */

    if (
        sessionStorage.getItem(
            "adminLoggedIn"
        ) !== "true"
    ) {

        window.location.href =
            "login.html";

    }


    /* =========================================
       BACKEND
    ========================================= */

    const API_BASE =
        "https://resplendent-solace-production-a0b3.up.railway.app";


    /* =========================================
       VARIABLES
    ========================================= */

    let allOrders = [];

    let previousNewOrderIds =
        new Set();

    let firstLoad = true;

    let notificationOrderId = null;

    let soundEnabled = false;

    let soundTimer = null;

    let audioContext = null;


    /* =========================================
       AUDIO INITIALIZATION
    ========================================= */

    function initializeAudio() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) {

                console.log(
                    "Web Audio API is not supported."
                );

                return;

            }

            if (!audioContext) {

                audioContext =
                    new AudioContext();

            }

            if (
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();

            }

            soundEnabled = true;

            document.getElementById(
                "soundStatus"
            ).innerText =
                "🔊 Order notification sound is ON.";

            console.log(
                "Order sound enabled automatically."
            );


            /*
               If NEW orders already exist,
               start the alarm after audio
               becomes available.
            */

            const newOrders =
                allOrders.filter(
                    order =>
                        getStatus(order) ===
                        "NEW"
                );

            if (
                newOrders.length > 0
            ) {

                startRepeatingSound();

            }

        }

        catch (error) {

            console.error(
                "Audio initialization error:",
                error
            );

        }

    }


    /* =========================================
       UNLOCK AUDIO ON FIRST USER INTERACTION
    ========================================= */

    function unlockAudio() {

        if (soundEnabled) {

            return;

        }

        initializeAudio();

    }


    /*
       Chrome and other browsers may block
       automatic audio.

       Therefore the first normal interaction
       anywhere on the admin page unlocks it.

       The admin does NOT need to click a
       special sound button.
    */

    document.addEventListener(
        "click",
        unlockAudio,
        {
            once: true
        }
    );

    document.addEventListener(
        "touchstart",
        unlockAudio,
        {
            once: true
        }
    );

    document.addEventListener(
        "keydown",
        unlockAudio,
        {
            once: true
        }
    );


    /* =========================================
       PLAY NOTIFICATION SOUND
    ========================================= */

    function playNotificationSound() {

        if (!soundEnabled) {

            return;

        }

        if (!audioContext) {

            return;

        }

        try {

            if (
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();

            }


            /*
               First beep
            */

            const oscillator1 =
                audioContext.createOscillator();

            const gain1 =
                audioContext.createGain();

            oscillator1.type =
                "square";

            oscillator1.frequency.setValueAtTime(
                900,
                audioContext.currentTime
            );

            oscillator1.frequency.setValueAtTime(
                700,
                audioContext.currentTime + 0.15
            );

            gain1.gain.setValueAtTime(
                0.001,
                audioContext.currentTime
            );

            gain1.gain.exponentialRampToValueAtTime(
                0.5,
                audioContext.currentTime + 0.02
            );

            gain1.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 0.3
            );

            oscillator1.connect(gain1);

            gain1.connect(
                audioContext.destination
            );

            oscillator1.start();

            oscillator1.stop(
                audioContext.currentTime + 0.3
            );


            /*
               Second beep
            */

            const oscillator2 =
                audioContext.createOscillator();

            const gain2 =
                audioContext.createGain();

            oscillator2.type =
                "square";

            oscillator2.frequency.setValueAtTime(
                900,
                audioContext.currentTime + 0.35
            );

            oscillator2.frequency.setValueAtTime(
                700,
                audioContext.currentTime + 0.5
            );

            gain2.gain.setValueAtTime(
                0.001,
                audioContext.currentTime + 0.35
            );

            gain2.gain.exponentialRampToValueAtTime(
                0.5,
                audioContext.currentTime + 0.37
            );

            gain2.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 0.65
            );

            oscillator2.connect(gain2);

            gain2.connect(
                audioContext.destination
            );

            oscillator2.start(
                audioContext.currentTime + 0.35
            );

            oscillator2.stop(
                audioContext.currentTime + 0.65
            );

        }

        catch (error) {

            console.error(
                "Notification sound error:",
                error
            );

        }

    }


    /* =========================================
       START REPEATING SOUND
    ========================================= */

    function startRepeatingSound() {

        if (!soundEnabled) {

            return;

        }

        if (!audioContext) {

            return;

        }

        stopRepeatingSound();

        playNotificationSound();

        soundTimer =
            setInterval(
                function() {

                    playNotificationSound();

                },
                3000
            );

    }


    /* =========================================
       STOP REPEATING SOUND
    ========================================= */

    function stopRepeatingSound() {

        if (
            soundTimer !== null
        ) {

            clearInterval(
                soundTimer
            );

            soundTimer = null;

        }

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================
       GET STATUS
    ========================================= */

    function getStatus(order) {

        return String(
            order.status || "NEW"
        ).toUpperCase();

    }


    /* =========================================
       CHECK NEW ORDERS
    ========================================= */

    function checkForNewOrders(
        orders
    ) {

        const newOrders =
            orders.filter(
                order =>
                    getStatus(order) ===
                    "NEW"
            );


        const currentIds =
            new Set(
                newOrders.map(
                    order =>
                        String(order.id)
                )
            );


        /* =====================================
           FIRST PAGE LOAD
        ===================================== */

        if (firstLoad) {

            firstLoad = false;

            newOrders.forEach(
                order => {

                    previousNewOrderIds.add(
                        String(order.id)
                    );

                }
            );


            /*
               Show existing NEW order
               notification.

               Sound will start automatically
               once browser audio is unlocked.
            */

            if (
                newOrders.length > 0
            ) {

                showNotification(
                    newOrders[
                        newOrders.length - 1
                    ]
                );

            }

            return;

        }


        /* =====================================
           FIND NEWLY ARRIVED ORDERS
        ===================================== */

        const newlyArrived =
            newOrders.filter(
                order =>
                    !previousNewOrderIds.has(
                        String(order.id)
                    )
            );


        if (
            newlyArrived.length > 0
        ) {

            showNotification(
                newlyArrived[
                    newlyArrived.length - 1
                ]
            );

        }


        previousNewOrderIds =
            currentIds;


        /* =====================================
           NO NEW ORDERS
        ===================================== */

        if (
            newOrders.length === 0
        ) {

            stopRepeatingSound();

            document.getElementById(
                "notification"
            ).style.display =
                "none";

            notificationOrderId =
                null;

        }

    }


    /* =========================================
       SHOW NOTIFICATION
    ========================================= */

    function showNotification(
        order
    ) {

        notificationOrderId =
            String(order.id);


        const customerName =
            order.customerName ||
            order.name ||
            "Customer";


        const amount =
            order.totalAmount ||
            order.total ||
            order.amount ||
            0;


        document.getElementById(
            "notificationText"
        ).innerHTML =
            `
            <strong>
                Order #${escapeHtml(order.id)}
            </strong>
            <br>

            Customer:
            ${escapeHtml(customerName)}

            <br>

            Amount:
            ₹${escapeHtml(amount)}
            `;


        document.getElementById(
            "notification"
        ).style.display =
            "block";


        /*
           Start alarm automatically.

           If browser audio has already been
           unlocked, sound starts immediately.

           If browser has not allowed audio yet,
           the first normal interaction with
           the page will unlock it.
        */

        if (soundEnabled) {

            startRepeatingSound();

        }

    }


    /* =========================================
       PREPARE NOTIFICATION ORDER
    ========================================= */

    function prepareNotificationOrder() {

        if (
            !notificationOrderId
        ) {

            return;

        }

        updateStatus(
            notificationOrderId,
            "PREPARING"
        );

    }


    /* =========================================
       CLOSE NOTIFICATION
    ========================================= */

    function closeNotification() {

        document.getElementById(
            "notification"
        ).style.display =
            "none";


        /*
           IMPORTANT:

           Closing the popup does NOT stop
           the alarm.

           The order is still NEW.

           The alarm will stop only when the
           order becomes PREPARING or there
           are no NEW orders.
        */

    }


    /* =========================================
       LOAD ORDERS
    ========================================= */

    async function loadOrders() {

        try {

            const response =
                await fetch(
                    API_BASE +
                    "/api/orders",
                    {
                        method: "GET",

                        credentials:
                            "include"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP error " +
                    response.status
                );

            }


            const orders =
                await response.json();


            allOrders =
                Array.isArray(orders)
                    ? orders
                    : [];


            checkForNewOrders(
                allOrders
            );


            updateStatistics(
                allOrders
            );


            displayOrders(
                allOrders
            );

        }

        catch (error) {

            console.error(
                "Failed to load orders:",
                error
            );

        }

    }


    /* =========================================
       UPDATE STATISTICS
    ========================================= */

    function updateStatistics(
        orders
    ) {

        const newOrders =
            orders.filter(
                order =>
                    getStatus(order) ===
                    "NEW"
            );


        const preparing =
            orders.filter(
                order =>
                    getStatus(order) ===
                    "PREPARING"
            );


        const ready =
            orders.filter(
                order =>
                    getStatus(order) ===
                    "READY"
            );


        const completed =
            orders.filter(
                order =>
                    getStatus(order) ===
                    "COMPLETED"
            );


        document.getElementById(
            "newCount"
        ).innerText =
            newOrders.length;


        document.getElementById(
            "preparingCount"
        ).innerText =
            preparing.length;


        document.getElementById(
            "readyCount"
        ).innerText =
            ready.length;


        document.getElementById(
            "completedCount"
        ).innerText =
            completed.length;


        document.getElementById(
            "newSectionCount"
        ).innerText =
            newOrders.length;


        document.getElementById(
            "preparingSectionCount"
        ).innerText =
            preparing.length;


        document.getElementById(
            "readySectionCount"
        ).innerText =
            ready.length;


        document.getElementById(
            "completedSectionCount"
        ).innerText =
            completed.length;

    }


    /* =========================================
       DISPLAY ORDERS
    ========================================= */

    function displayOrders(
        orders
    ) {

        const newContainer =
            document.getElementById(
                "newOrders"
            );


        const preparingContainer =
            document.getElementById(
                "preparingOrders"
            );


        const readyContainer =
            document.getElementById(
                "readyOrders"
            );


        const completedContainer =
            document.getElementById(
                "completedOrders"
            );


        newContainer.innerHTML =
            "";


        preparingContainer.innerHTML =
            "";


        readyContainer.innerHTML =
            "";


        completedContainer.innerHTML =
            "";


        const searchText =
            document.getElementById(
                "orderSearch"
            ).value
            .toLowerCase()
            .trim();


        const filteredOrders =
            orders.filter(
                order => {

                    if (!searchText) {

                        return true;

                    }


                    const id =
                        String(
                            order.id || ""
                        ).toLowerCase();


                    const name =
                        String(
                            order.customerName ||
                            order.name ||
                            ""
                        ).toLowerCase();


                    const phone =
                        String(
                            order.customerPhone ||
                            order.phone ||
                            ""
                        ).toLowerCase();


                    return (
                        id.includes(searchText) ||
                        name.includes(searchText) ||
                        phone.includes(searchText)
                    );

                }
            );


        filteredOrders.forEach(
            order => {

                const status =
                    getStatus(order);


                const card =
                    createOrderCard(
                        order
                    );


                if (
                    status === "NEW"
                ) {

                    newContainer.appendChild(
                        card
                    );

                }

                else if (
                    status === "PREPARING"
                ) {

                    preparingContainer.appendChild(
                        card
                    );

                }

                else if (
                    status === "READY"
                ) {

                    readyContainer.appendChild(
                        card
                    );

                }

                else if (
                    status === "COMPLETED"
                ) {

                    completedContainer.appendChild(
                        card
                    );

                }

            }
        );


        showEmptyMessage(
            newContainer
        );


        showEmptyMessage(
            preparingContainer
        );


        showEmptyMessage(
            readyContainer
        );


        showEmptyMessage(
            completedContainer
        );

    }


    /* =========================================
       CREATE ORDER CARD
    ========================================= */

    function createOrderCard(
        order
    ) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "order-card";


        const id =
            escapeHtml(
                order.id
            );


        const customerName =
            escapeHtml(
                order.customerName ||
                order.name ||
                "Not provided"
            );


        const phone =
            escapeHtml(
                order.customerPhone ||
                order.phone ||
                "Not provided"
            );


        const address =
            escapeHtml(
                order.customerAddress ||
                order.address ||
                "Not provided"
            );


        const total =
            order.totalAmount ||
            order.total ||
            order.amount ||
            0;


        let itemsHtml =
            "";


        let items =
            order.items ||
            order.orderItems ||
            order.menuItems ||
            [];


        if (
            !Array.isArray(items)
        ) {

            items = [];

        }


        items.forEach(
            item => {

                const itemName =
                    escapeHtml(
                        item.name ||
                        item.itemName ||
                        "Item"
                    );


                const quantity =
                    item.quantity ||
                    1;


                const price =
                    item.price ||
                    0;


                itemsHtml +=
                    `
                    <div class="order-item">

                        <span>
                            ${itemName}
                            × ${quantity}
                        </span>

                        <span>
                            ₹${price}
                        </span>

                    </div>
                    `;

            }
        );


        if (!itemsHtml) {

            itemsHtml =
                `
                <div class="order-item">

                    <span>
                        Order items
                    </span>

                    <span>
                        See order details
                    </span>

                </div>
                `;

        }


        const status =
            getStatus(order);


        let buttonsHtml =
            "";


        if (
            status === "NEW"
        ) {

            buttonsHtml =
                `
                <div class="status-buttons">

                    <button
                        class="preparing-btn"
                        onclick="updateStatus(
                            '${id}',
                            'PREPARING'
                        )">

                        👨‍🍳 Preparing

                    </button>

                </div>
                `;

        }


        else if (
            status === "PREPARING"
        ) {

            buttonsHtml =
                `
                <div class="status-buttons">

                    <button
                        class="ready-btn"
                        onclick="updateStatus(
                            '${id}',
                            'READY'
                        )">

                        ✅ Ready

                    </button>

                </div>
                `;

        }


        else if (
            status === "READY"
        ) {

            buttonsHtml =
                `
                <div class="status-buttons">

                    <button
                        class="completed-btn"
                        onclick="updateStatus(
                            '${id}',
                            'COMPLETED'
                        )">

                        📦 Completed

                    </button>

                </div>
                `;

        }


        card.innerHTML =
            `
            <h3>
                Order #${id}
            </h3>


            <p>

                <strong>
                    Customer:
                </strong>

                ${customerName}

            </p>


            <p>

                <strong>
                    Phone:
                </strong>

                ${phone}

            </p>


            <p>

                <strong>
                    Address:
                </strong>

                ${address}

            </p>


            <div class="order-items">

                ${itemsHtml}

            </div>


            <p class="total">

                Total:
                ₹${escapeHtml(total)}

            </p>


            ${buttonsHtml}

            `;


        return card;

    }


    /* =========================================
       EMPTY MESSAGE
    ========================================= */

    function showEmptyMessage(
        container
    ) {

        if (
            container.children.length === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "empty";


            empty.innerText =
                "No orders here.";


            container.appendChild(
                empty
            );

        }

    }


    /* =========================================
       SEARCH
    ========================================= */

    function searchOrders() {

        displayOrders(
            allOrders
        );

    }


    /* =========================================
       UPDATE ORDER STATUS
    ========================================= */

    async function updateStatus(
        orderId,
        newStatus
    ) {

        try {

            const response =
                await fetch(
                    `${API_BASE}/api/orders/${encodeURIComponent(orderId)}/status?status=${encodeURIComponent(newStatus)}`,
                    {
                        method: "PUT",

                        credentials:
                            "include"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Status update failed: " +
                    response.status
                );

            }


            /*
               Stop alarm when the order
               becomes PREPARING.
            */

            if (
                newStatus ===
                "PREPARING"
            ) {

                stopRepeatingSound();


                document.getElementById(
                    "notification"
                ).style.display =
                    "none";


                notificationOrderId =
                    null;

            }


            await loadOrders();

        }

        catch (error) {

            console.error(
                "Status update error:",
                error
            );


            alert(
                "Could not update order status."
            );

        }

    }


    /* =========================================
       MENU MANAGEMENT
    ========================================= */

    function openMenuManagement() {

        window.location.href =
            "menu-management.html";

    }


    /* =========================================
       LOGOUT
    ========================================= */

    function logout() {

        sessionStorage.removeItem(
            "adminLoggedIn"
        );


        stopRepeatingSound();


        window.location.href =
            "login.html";

    }


    /* =========================================
       START DASHBOARD
    ========================================= */

    loadOrders();


    /*
       Check for new orders every 5 seconds.
    */

    setInterval(
        loadOrders,
        5000
    );


</script>
