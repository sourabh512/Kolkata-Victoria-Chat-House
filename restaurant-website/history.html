<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order History - Kolkata Victoria Chat House</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* HEADER */

        header {
            background: #e65100;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 24px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-buttons button {
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn {
            background: white;
            color: #e65100;
        }

        .logout-btn {
            background: #333;
            color: white;
        }

        /* MAIN */

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 30px auto;
        }

        /* SUMMARY */

        .summary {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;

            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 20px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

            text-align: center;
        }

        .summary-card h3 {
            color: #777;
            margin-bottom: 10px;
        }

        .summary-card p {
            font-size: 28px;
            font-weight: bold;
            color: #e65100;
        }

        /* FILTER AREA */

        .filter-area {
            background: white;
            padding: 20px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

            margin-bottom: 25px;
        }

        .filter-area h2 {
            margin-bottom: 15px;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filters button {
            padding: 10px 16px;

            border: 1px solid #e65100;

            background: white;
            color: #e65100;

            border-radius: 5px;

            cursor: pointer;

            font-weight: bold;
        }

        .filters button:hover,
        .filters button.active {
            background: #e65100;
            color: white;
        }

        .search-box {
            margin-top: 15px;
        }

        .search-box input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }

        /* ORDERS */

        .orders-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .order-card {
            background: white;

            border-radius: 10px;

            padding: 20px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;

            padding-bottom: 12px;

            border-bottom: 1px solid #ddd;
        }

        .order-id {
            font-size: 18px;
            font-weight: bold;
            color: #e65100;
        }

        .completed-badge {
            background: #2e7d32;
            color: white;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 13px;
            font-weight: bold;
        }

        .order-details {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-bottom: 15px;
        }

        .detail {
            padding: 8px;
        }

        .detail strong {
            color: #555;
        }

        .items {
            background: #f8f8f8;

            padding: 12px;

            border-radius: 5px;

            margin-top: 10px;
        }

        .total {
            text-align: right;

            margin-top: 15px;

            font-size: 20px;

            font-weight: bold;

            color: #e65100;
        }

        /* EMPTY */

        .empty {
            background: white;

            padding: 40px;

            text-align: center;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

            color: #777;

            font-size: 18px;
        }

        /* LOADING */

        .loading {
            text-align: center;

            padding: 40px;

            font-size: 18px;

            color: #777;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .order-details {
                grid-template-columns: 1fr;
            }

            .order-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .filters {
                flex-direction: column;
            }

            .filters button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        📜 Order History
    </h1>

    <div class="header-buttons">

        <button
            class="back-btn"
            onclick="goBack()">
            ← Back to Dashboard
        </button>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </div>

</header>


<div class="container">


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-card">

            <h3>
                Completed Orders
            </h3>

            <p id="history-count">
                0
            </p>

        </div>


        <div class="summary-card">

            <h3>
                Historical Revenue
            </h3>

            <p id="history-revenue">
                ₹0
            </p>

        </div>

    </div>



    <!-- FILTER -->

    <div class="filter-area">
  <!-- DAILY SALES REPORT -->

<div class="filter-area">

    <h2>📊 Today's Sales Report</h2>

    <div style="
        display:flex;
        gap:20px;
        flex-wrap:wrap;
        margin-top:15px;
    ">

        <div style="
            flex:1;
            min-width:200px;
            background:#fff3e0;
            padding:20px;
            border-radius:8px;
        ">

            <strong>Today's Orders</strong>

            <div
                id="today-report-orders"
                style="
                    font-size:28px;
                    font-weight:bold;
                    color:#e65100;
                    margin-top:8px;
                ">

                0

            </div>

        </div>


        <div style="
            flex:1;
            min-width:200px;
            background:#fff3e0;
            padding:20px;
            border-radius:8px;
        ">

            <strong>Today's Revenue</strong>

            <div
                id="today-report-revenue"
                style="
                    font-size:28px;
                    font-weight:bold;
                    color:#e65100;
                    margin-top:8px;
                ">

                ₹0

            </div>

        </div>

    </div>


    <button
        onclick="printDailyReport()"
        style="
            margin-top:20px;
            background:#e65100;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:5px;
            cursor:pointer;
            font-weight:bold;
        ">

        🖨️ Print Daily Report

    </button>

</div>
        <h2>
            Filter Orders
        </h2>


        <div class="filters">

            <button
                id="all-btn"
                class="active"
                onclick="setFilter('all')">
                All
            </button>

            <button
                id="today-btn"
                onclick="setFilter('today')">
                Today
            </button>

            <button
                id="yesterday-btn"
                onclick="setFilter('yesterday')">
                Yesterday
            </button>

            <button
                id="week-btn"
                onclick="setFilter('week')">
                This Week
            </button>

            <button
                id="month-btn"
                onclick="setFilter('month')">
                This Month
            </button>

        </div>


        <div class="search-box">

            <input
                type="text"
                id="search-input"
                placeholder="Search by order ID, name, phone, address or items..."
                oninput="displayOrders()">

        </div>

    </div>



    <!-- ORDERS -->

    <div id="orders-container"
         class="orders-container">

        <div class="loading">

            Loading order history...

        </div>

    </div>


</div>



<script>


/* =========================================
   LOGIN CHECK
========================================= */

if (sessionStorage.getItem("adminLoggedIn") !== "true") {

    window.location.href = "login.html";

}


/* =========================================
   VARIABLES
========================================= */

let allOrders = [];

let currentFilter = "all";


/* =========================================
   LOAD ORDERS
========================================= */

function loadHistory() {

    fetch("http://127.0.0.1:8080/api/orders", {

        method: "GET",

        credentials: "include"

    })

    .then(function(response) {

        if (!response.ok) {

            throw new Error("Could not load orders");

        }

        return response.json();

    })

    .then(function(orders) {

        /*
         Only completed orders are shown
        */

        allOrders = orders.filter(function(order) {

            return order.status === "COMPLETED";

        });

        displayOrders();

    })

    .catch(function(error) {

        console.error(
            "History error:",
            error
        );

        document.getElementById(
            "orders-container"
        ).innerHTML = `

            <div class="empty">

                ❌ Could not load order history.

                <br><br>

                Make sure the Spring Boot server
                is running.

            </div>

        `;

    });

}


/* =========================================
   FILTER
========================================= */

function setFilter(filter) {

    currentFilter = filter;


    /*
       Remove active from all buttons
    */

    document
        .querySelectorAll(".filters button")
        .forEach(function(button) {

            button.classList.remove("active");

        });


    /*
       Add active to selected button
    */

    document
        .getElementById(filter + "-btn")
        .classList.add("active");


    displayOrders();

}


/* =========================================
   DATE FILTER
========================================= */

function matchesDateFilter(order) {

    if (currentFilter === "all") {

        return true;

    }


    if (!order.orderDateTime) {

        return false;

    }


    let orderDate =
        new Date(order.orderDateTime);

    let today =
        new Date();


    /*
       TODAY
    */

    if (currentFilter === "today") {

        return (
            orderDate.getDate() === today.getDate()
            &&
            orderDate.getMonth() === today.getMonth()
            &&
            orderDate.getFullYear() === today.getFullYear()
        );

    }


    /*
       YESTERDAY
    */

    if (currentFilter === "yesterday") {

        let yesterday =
            new Date();

        yesterday.setDate(
            yesterday.getDate() - 1
        );

        return (
            orderDate.getDate() === yesterday.getDate()
            &&
            orderDate.getMonth() === yesterday.getMonth()
            &&
            orderDate.getFullYear() === yesterday.getFullYear()
        );

    }


    /*
       THIS WEEK
    */

    if (currentFilter === "week") {

        let startOfWeek =
            new Date(today);

        let day =
            startOfWeek.getDay();

        /*
          Sunday = 0
          Monday = 1
        */

        let difference =
            day === 0 ? 6 : day - 1;

        startOfWeek.setDate(
            startOfWeek.getDate() - difference
        );

        startOfWeek.setHours(
            0, 0, 0, 0
        );

        return orderDate >= startOfWeek;

    }


    /*
       THIS MONTH
    */

    if (currentFilter === "month") {

        return (
            orderDate.getMonth() === today.getMonth()
            &&
            orderDate.getFullYear() === today.getFullYear()
        );

    }


    return true;

}

/* =========================================
   UpdateTodaysREport()
========================================= */

function updateTodayReport() {

    let today = new Date();

    let todayOrders =
        allOrders.filter(function(order) {

            if (!order.orderDateTime) {
                return false;
            }

            let orderDate =
                new Date(order.orderDateTime);

            return (
                orderDate.getDate() === today.getDate()
                &&
                orderDate.getMonth() === today.getMonth()
                &&
                orderDate.getFullYear() === today.getFullYear()
            );

        });


    let revenue = 0;


    todayOrders.forEach(function(order) {

        revenue =
            revenue + Number(order.total || 0);

    });


    document.getElementById(
        "today-report-orders"
    ).innerText =
        todayOrders.length;


    document.getElementById(
        "today-report-revenue"
    ).innerText =
        "₹" + revenue.toFixed(2);

}

function printDailyReport() {

    let today = new Date();


    let todayOrders =
        allOrders.filter(function(order) {

            if (!order.orderDateTime) {
                return false;
            }

            let orderDate =
                new Date(order.orderDateTime);

            return (
                orderDate.getDate() === today.getDate()
                &&
                orderDate.getMonth() === today.getMonth()
                &&
                orderDate.getFullYear() === today.getFullYear()
            );

        });


    if (todayOrders.length === 0) {

        alert(
            "There are no completed orders for today."
        );

        return;

    }


    let revenue = 0;


    todayOrders.forEach(function(order) {

        revenue =
            revenue + Number(order.total || 0);

    });


    let dateText =
        today.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );


    let reportWindow =
        window.open("", "_blank");


    let orderRows = "";


    todayOrders.forEach(function(order) {

        orderRows += `

            <tr>

                <td>
                    #${order.id}
                </td>

                <td>
                    ${escapeHtml(order.name)}
                </td>

                <td>
                    ${escapeHtml(order.items)}
                </td>

                <td>
                    ₹${Number(order.total || 0).toFixed(2)}
                </td>

            </tr>

        `;

    });


    reportWindow.document.write(`

        <!DOCTYPE html>

        <html>

        <head>

            <title>
                Daily Sales Report
            </title>

            <style>

                body {
                    font-family: Arial, sans-serif;
                    padding: 30px;
                }

                .restaurant {
                    text-align: center;
                    font-size: 25px;
                    font-weight: bold;
                }

                .title {
                    text-align: center;
                    font-size: 20px;
                    margin-top: 10px;
                }

                .date {
                    text-align: center;
                    color: #555;
                    margin-top: 5px;
                }

                table {
                    width: 100%;
                    border-collapse: collapse;
                    margin-top: 30px;
                }

                th,
                td {
                    border: 1px solid #ccc;
                    padding: 10px;
                    text-align: left;
                }

                th {
                    background: #eeeeee;
                }

                .summary {
                    margin-top: 25px;
                    text-align: right;
                    font-size: 20px;
                    font-weight: bold;
                }

                .footer {
                    margin-top: 40px;
                    text-align: center;
                }

            </style>

        </head>


        <body>


            <div class="restaurant">

                Kolkata Victoria Chat House

            </div>


            <div class="title">

                DAILY SALES REPORT

            </div>


            <div class="date">

                ${dateText}

            </div>


            <table>

                <thead>

                    <tr>

                        <th>
                            Order ID
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Items
                        </th>

                        <th>
                            Amount
                        </th>

                    </tr>

                </thead>


                <tbody>

                    ${orderRows}

                </tbody>

            </table>


            <div class="summary">

                Completed Orders:
                ${todayOrders.length}

                <br><br>

                TOTAL SALES:
                ₹${revenue.toFixed(2)}

            </div>


            <div class="footer">

                <hr>

                Kolkata Victoria Chat House

                <br>

                Thank you!

            </div>


        </body>

        </html>

    `);


    reportWindow.document.close();


    reportWindow.onload = function() {

        reportWindow.print();

    };

}
/* =========================================
   DISPLAY ORDERS
========================================= */

function displayOrders() {
updateTodayReport();
    let container =
        document.getElementById(
            "orders-container"
        );


    let search =
        document.getElementById(
            "search-input"
        ).value
        .toLowerCase()
        .trim();


    /*
       Apply date filter
    */

    let filteredOrders =
        allOrders.filter(function(order) {

            return matchesDateFilter(order);

        });


    /*
       Apply search
    */

    if (search !== "") {

        filteredOrders =
            filteredOrders.filter(function(order) {

                let text =
                    String(order.id)
                    + " "
                    + String(order.name)
                    + " "
                    + String(order.phone)
                    + " "
                    + String(order.address)
                    + " "
                    + String(order.items);

                return text
                    .toLowerCase()
                    .includes(search);

            });

    }


    /*
       Sort newest first
    */

    filteredOrders.sort(function(a, b) {

        return b.id - a.id;

    });


    /*
       Update summary
    */

    document.getElementById(
        "history-count"
    ).innerText =
        filteredOrders.length;


    let revenue = 0;

    filteredOrders.forEach(function(order) {

        revenue =
            revenue + Number(order.total || 0);

    });


    document.getElementById(
        "history-revenue"
    ).innerText =
        "₹" + revenue.toFixed(2);


    /*
       No orders
    */

    if (filteredOrders.length === 0) {

        container.innerHTML = `

            <div class="empty">

                📭 No completed orders found.

            </div>

        `;

        return;

    }


    /*
       Create order cards
    */

    container.innerHTML = "";


    filteredOrders.forEach(function(order) {

        let orderDate =
            formatDateTime(
                order.orderDateTime
            );


        let card =
            document.createElement("div");

        card.className =
            "order-card";


        card.innerHTML = `

            <div class="order-header">

                <div class="order-id">

                    Order #${order.id}

                </div>

                <div class="completed-badge">

                    COMPLETED

                </div>

            </div>


            <div class="order-details">

                <div class="detail">

                    <strong>
                        Customer:
                    </strong>

                    ${escapeHtml(order.name)}

                </div>


                <div class="detail">

                    <strong>
                        Phone:
                    </strong>

                    ${escapeHtml(order.phone)}

                </div>


                <div class="detail">

                    <strong>
                        Address:
                    </strong>

                    ${escapeHtml(order.address)}

                </div>


                <div class="detail">

                    <strong>
                        Date & Time:
                    </strong>

                    ${orderDate}

                </div>

            </div>


            <div class="items">

                <strong>
                    Items:
                </strong>

                <br>

                ${escapeHtml(order.items)}

            </div>


          <div class="total">

    Total:
    ₹${Number(order.total || 0).toFixed(2)}

</div>

<div style="text-align: right; margin-top: 15px;">

    <button
        onclick="printOrder(${order.id})"
        style="
            background:#e65100;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:5px;
            cursor:pointer;
            font-weight:bold;
        ">

        🖨️ Print Order

    </button>

</div>

        `;


        container.appendChild(card);

    });

}


/* =========================================
   DATE FORMAT
========================================= */

function formatDateTime(dateTime) {

    if (!dateTime) {

        return "Not available";

    }


    let date =
        new Date(dateTime);


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
        }
    );

}


/* =========================================
   HTML SAFETY
========================================= */

function escapeHtml(value) {

    if (value === null || value === undefined) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   BACK TO ADMIN
========================================= */

function goBack() {

    window.location.href =
        "admin.html";

}


/* =========================================
   LOGOUT
========================================= */

function logout() {

    fetch(
        "http://127.0.0.1:8080/api/logout",
        {
            method: "POST",
            credentials: "include"
        }
    )

    .then(function(response) {

        sessionStorage.removeItem(
            "adminLoggedIn"
        );

        window.location.href =
            "login.html";

    })

    .catch(function(error) {

        console.error(
            "Logout error:",
            error
        );

        sessionStorage.removeItem(
            "adminLoggedIn"
        );

        window.location.href =
            "login.html";

    });

}


/* =========================================
   printOrders()
========================================= */
function printOrder(orderId) {

    let order = allOrders.find(function(item) {

        return item.id === orderId;

    });


    if (!order) {

        alert("Order not found.");

        return;

    }


    let orderDate =
        formatDateTime(order.orderDateTime);


    let printWindow =
        window.open("", "_blank");


    printWindow.document.write(`

        <html>

        <head>

                Order #${order.id}
            </title>

            <style>

                body {
                    font-family: Arial, sans-serif;
                    padding: 30px;
                    max-width: 700px;

                }

                    font-size: 25px;
                    font-weight: bold;
                }

                    text-align: center;

                }

                    font-weight: bold;
                }

            </style>

        </head>


        <body>


            <div class="restaurant-name">

                Kolkata Victoria Chat House

            </div>


            <div class="subtitle">

                SahaKarnagar Bangalore

            </div>


            <hr>


            <h2>
                Order #${order.id}
            </h2>


            <div class="row">

                </strong>
