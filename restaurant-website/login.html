<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #fff3e0;

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-box {
        width: 400px;
        max-width: 90%;

        background: white;

        padding: 35px;

        border-radius: 12px;

        box-shadow: 0 5px 25px rgba(0,0,0,0.2);
    }

    .login-box h1 {
        text-align: center;

        color: #e65100;

        margin-bottom: 10px;
    }

    .login-box p {
        text-align: center;

        color: #666;

        margin-bottom: 25px;
    }

    .login-box label {
        display: block;

        font-weight: bold;

        margin-bottom: 7px;
    }

    .login-box input {
        width: 100%;

        padding: 12px;

        margin-bottom: 20px;

        border: 1px solid #ccc;

        border-radius: 5px;

        font-size: 16px;
    }

    .login-box input:focus {
        outline: none;

        border-color: #e65100;
    }

    .login-btn {
        width: 100%;

        padding: 13px;

        background: #e65100;

        color: white;

        border: none;

        border-radius: 5px;

        font-size: 17px;

        font-weight: bold;

        cursor: pointer;
    }

    .login-btn:hover {
        background: #bf360c;
    }

    #error-message {
        color: red;

        text-align: center;

        margin-top: 15px;

        display: none;
    }

    #loading {
        text-align: center;

        color: #e65100;

        margin-top: 15px;

        display: none;
    }

</style>


</head>

<body>

<div class="login-box">


<h1>Admin Login</h1>

<p>Kolkata Victoria Chat House</p>

<form onsubmit="login(event)">

    <label for="username">
        Username
    </label>

    <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
    >

    <label for="password">
        Password
    </label>

    <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
    >

    <button
            type="submit"
            class="login-btn">
        Login
    </button>

    <p id="loading">
        Checking login...
    </p>

    <p id="error-message">
        Invalid username or password
    </p>

</form>


</div>

<script>

    function login(event) {

        event.preventDefault();


        let username =
            document.getElementById("username").value;

        let password =
            document.getElementById("password").value;


        document.getElementById("loading")
            .style.display = "block";

        document.getElementById("error-message")
            .style.display = "none";

fetch("https://kolkata-victoria-chat-house-production.up.railway.app/api/login", {

    method: "POST",

    credentials: "include",

    headers: {
        "Content-Type": "application/json"
    },

            body: JSON.stringify({

                username: username,
                password: password

            })

        })

        .then(function(response) {

            if (!response.ok) {

                throw new Error("Login request failed");

            }

            return response.json();

        })

        .then(function(data) {

            document.getElementById("loading")
                .style.display = "none";


            if (data.success === true) {

                sessionStorage.setItem(
                    "adminLoggedIn",
                    "true"
                );

                window.location.href =
                    "admin.html";

            } else {

                document.getElementById("error-message")
                    .style.display = "block";

            }

        })

        .catch(function(error) {

            console.error(error);

            document.getElementById("loading")
                .style.display = "none";

            document.getElementById("error-message")
                .innerText =
                    "Cannot connect to server.";

            document.getElementById("error-message")
                .style.display = "block";

        });

    }

</script>

</body>

</html>
